<div class="main-wrapper">

  <div class="home-container">
    <app-header  [showFilter] ='true' ></app-header>

    <div class="title-section">
      <h2>Subrazas de {{ breedName }}</h2>
    </div>

    <!-- Mostrar las subrazas solo si no estamos cargando y hay subrazas -->
    <div class="breed-grid" [ngClass]="{ 'single-image': subBreeds.length === 1 }" *ngIf="!loading && subBreeds.length > 0">
      <mat-card *ngFor="let sub of subBreeds" class="breed-card"  (click)="viewGallery(breedName, sub.name)">
        <img mat-card-image *ngIf="sub.image" [src]="sub.image" alt="{{ sub.name }}" />
        <mat-card-content>
          <h3>{{ sub.name }}</h3>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button class="subbreed-gallery-btn" (click)="viewGallery(breedName, sub.name)">
            Gallery
          </button>
        </mat-card-actions>
      </mat-card>
    </div>


    <!-- Mostrar el spinner mientras estamos cargando -->
    <div class="spinner" *ngIf="loading">
      <mat-spinner></mat-spinner>
    </div>

    <!-- Si no hay subrazas, mostrar un mensaje -->
    <div *ngIf="!loading && subBreeds.length === 0">
      <p>No hay subrazas disponibles para esta raza.</p>
    </div>
  </div>
</div>
